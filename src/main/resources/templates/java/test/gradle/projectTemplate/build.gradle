plugins {
    // %static-code-analysis-start%
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.13'
    // %static-code-analysis-stop%
    id 'com.teamscale' version '34.2.1'
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
version = '1.0.0'
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    // %maven-central-mirror-start%
    maven {
        name = 'artemisMavenCentralMirror'
        url = '${mavenCentralMirrorUrl}'
    }
    // %maven-central-mirror-stop%
    mavenCentral()
    mavenLocal()
}

def aresVersion = '2.2.1'

configurations {
    // The Ares agent jar, resolved on its own so that it can be passed to the test JVM as -javaagent
    aresAgent {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // Ares 2 comes with JUnit 5 and AssertJ. It runs in instrumentation mode here (see SecurityPolicy.yaml), so the
    // agent is all it needs at runtime and the student code is not woven at compile time.
    testImplementation "de.tum.cit.ase:ares:${aresVersion}"
    aresAgent "de.tum.cit.ase:ares:${aresVersion}:agent"
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    // testImplementation(':${exerciseNamePomXml}')
    // testImplementation(':${exerciseNamePomXml}-Solution')
}

def assignmentSrcDir = "${studentWorkingDirectoryNoSlash}"
// %static-code-analysis-start%
def scaConfigDirectory = "$projectDir/staticCodeAnalysisConfig"
// %static-code-analysis-stop%

sourceSets {
    // %non-sequential-start%
    test {
        java {
            srcDir 'test'
        }
        resources {
            srcDir 'test'
        }
    }
    // %non-sequential-stop%

    // %sequential-start%
    structuralTest {
        java {
            srcDir 'structural/test'
            compileClasspath += sourceSets.main.runtimeClasspath
        }
        resources {
            srcDir 'structural/test'
        }
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }

    behaviorTest {
        java {
            srcDir 'behavior/test'
            compileClasspath += sourceSets.main.runtimeClasspath
        }
        resources {
            srcDir 'behavior/test'
        }
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    // %sequential-stop%

    main {
        java {
            srcDirs = [assignmentSrcDir]
        }
        resources {
            srcDirs = []
        }
    }
}

// Ares reserved-package build boundary, version 2 (shipped with Ares as GradleReservedPackages.gradle): student code must
// not shadow trusted packages. Student classes in these packages would replace the real ones, e.g. an Assertions class
// that never fails, and forge the grading. Every Test task depends on this check, not only `check`.
def aresReservedPackagePatterns = [
        // The JDK
        'java/**', 'javax/**', 'jdk/**', 'sun/**', 'com/sun/**',
        // Ares and the libraries it brings to the test runtime
        'anonymous/toolclasses/**', 'ch/qos/logback/**', 'com/fasterxml/**', 'com/github/javaparser/**', 'com/google/**',
        'com/ibm/wala/**', 'com/intellij/**', 'com/opencsv/**', 'com/tngtech/archunit/**', 'de/tum/cit/ase/ares/**',
        'javassist/**', 'junit/**', 'metatest/**', 'net/bytebuddy/**', 'net/jqwik/**', 'org/apache/**', 'org/apfloat/**',
        'org/apiguardian/**', 'org/aspectj/**', 'org/assertj/**', 'org/checkerframework/**', 'org/eclipse/**',
        'org/gradle/**', 'org/hamcrest/**', 'org/jacoco/**', 'org/jgrapht/**', 'org/jheaps/**', 'org/json/**',
        'org/jspecify/**', 'org/junit/**', 'org/mockito/**', 'org/objenesis/**', 'org/opentest4j/**', 'org/slf4j/**',
        'org/yaml/**', 'worker/org/gradle/**'
]

tasks.register('verifyAresReservedPackagesV2') {
    dependsOn tasks.named('classes')
    def studentClassesDirs = sourceSets.main.output.classesDirs
    def reservedPrefixes = aresReservedPackagePatterns.collect { it.substring(0, it.length() - 2) }
    inputs.files(studentClassesDirs).withPropertyName('studentClasses')
    doLast {
        def forbidden = []
        studentClassesDirs.files.each { root ->
            if (!root.isDirectory()) {
                return
            }
            def rootPath = root.toPath()
            root.eachFileRecurse { candidate ->
                if (!candidate.isFile()) {
                    return
                }
                def relative = rootPath.relativize(candidate.toPath()).toString().replace(File.separator, '/')
                if (reservedPrefixes.any { relative.startsWith(it) }) {
                    forbidden << relative
                }
            }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Ares reserved-package validation 2 rejected student output: ${forbidden.sort()}. No bypass flag is supported.")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyAresReservedPackagesV2') }

tasks.withType(Test).configureEach {
    dependsOn tasks.named('verifyAresReservedPackagesV2')
    def aresAgentJar = configurations.aresAgent
    inputs.files(aresAgentJar).withPropertyName('aresAgent')
    jvmArgumentProviders.add({
        ["-javaagent:${aresAgentJar.singleFile.absolutePath}",
         '--add-exports', 'java.base/java.lang=ALL-UNNAMED',
         '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
         '--add-opens', 'java.base/java.io=ALL-UNNAMED',
         '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
         '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
         '--add-opens', 'java.base/java.net=ALL-UNNAMED',
         '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
         '--add-opens', 'java.base/java.nio.channels=ALL-UNNAMED',
         '--add-opens', 'java.base/java.util=ALL-UNNAMED',
         '--add-opens', 'java.base/java.util.concurrent=ALL-UNNAMED',
         '--add-opens', 'java.base/java.util.concurrent.atomic=ALL-UNNAMED',
         '--add-opens', 'java.base/java.util.concurrent.locks=ALL-UNNAMED',
         '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
         '--add-opens', 'java.base/sun.net.www.protocol.http=ALL-UNNAMED',
         '--add-opens', 'java.base/sun.net.www.protocol.https=ALL-UNNAMED',
         '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
         '--add-opens', 'jdk.unsupported/sun.misc=ALL-UNNAMED']
    } as CommandLineArgumentProvider)
}

test {
    defaultCharacterEncoding = 'UTF-8'
    testLogging.showStandardStreams = true
    useJUnitPlatform()
}

// %sequential-start%
configurations {
    structuralTestImplementation.extendsFrom testImplementation
    structuralTestRuntime.extendsFrom testRuntime
    behaviorTestImplementation.extendsFrom testImplementation
    behaviorTestRuntime.extendsFrom testRuntime
}

tasks.register('structuralTests', Test) {
    testClassesDirs = sourceSets.structuralTest.output.classesDirs
    classpath += sourceSets.structuralTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.register('behaviorTests', Test) {
    testClassesDirs = sourceSets.behaviorTest.output.classesDirs
    classpath += sourceSets.behaviorTest.runtimeClasspath
    useJUnitPlatform()
}
// %sequential-stop%

// %static-code-analysis-start%
checkstyle {
    toolVersion = '14.3.0'
    configFile = file("$scaConfigDirectory/checkstyle-configuration.xml")
    configDirectory.set(file(scaConfigDirectory))
    ignoreFailures = true
    // exclude the test files
    checkstyleTest.enabled = false
    checkstyleMain.reports {
        xml.outputLocation = file('target/checkstyle-result.xml')
    }
}

spotbugs {
    toolVersion = '4.10.5'
    excludeFilter = file("$scaConfigDirectory/spotbugs-exclusions.xml")
    ignoreFailures = true
    // exclude the test files
    spotbugsTest.enabled = false
    spotbugsMain.reports {
        xml {
            enabled = true
            outputLocation = file('target/spotbugsXml.xml')
        }
        html.enabled = false
    }
}

pmd {
    ruleSets = ["$scaConfigDirectory/pmd-configuration.xml"]
    rulesMinimumPriority = 5
    ignoreFailures = true
    toolVersion = '7.28.0'
    // exclude the test files
    pmdTest.enabled = false
    pmdMain.reports {
        xml.outputLocation = file('target/pmd.xml')
    }
}
// %static-code-analysis-stop%
