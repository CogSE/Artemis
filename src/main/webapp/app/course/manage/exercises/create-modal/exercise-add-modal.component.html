<tum-ui-dialog [header]="'artemisApp.exerciseManagement.addModal.header' | artemisTranslate" [visible]="visible()" (visibleChange)="visibleChange.emit($event)" size="medium">
    <div class="tab-bar mb-3">
        <button
            class="tab-btn {{ activeTab() === 'create' ? 'tab-btn--active' : '' }}"
            (click)="setActiveTab('create')"
            jhiTranslate="artemisApp.exerciseManagement.addModal.tab.create"
        ></button>
        <button
            class="tab-btn {{ activeTab() === 'import' ? 'tab-btn--active' : '' }}"
            (click)="setActiveTab('import')"
            jhiTranslate="artemisApp.exerciseManagement.addModal.tab.import"
        ></button>
        <button
            class="tab-btn {{ activeTab() === 'export' ? 'tab-btn--active' : '' }}"
            (click)="setActiveTab('export')"
            jhiTranslate="artemisApp.exerciseManagement.addModal.tab.export"
        ></button>
    </div>

    <!-- ── Create tab ── -->
    @if (activeTab() === 'create') {
        <p class="text-muted-color text-sm mb-3" jhiTranslate="artemisApp.exerciseManagement.addModal.createHint"></p>
        <div class="exercise-grid">
            @for (card of exerciseTypeCards(); track card.type) {
                <button class="exercise-card" [attr.data-testid]="'create-' + card.type + '-exercise'" (click)="navigateToCreate(card)" type="button">
                    <div class="card-icon-wrapper">
                        <fa-icon [icon]="card.icon" />
                    </div>
                    <h6 [jhiTranslate]="card.labelKey"></h6>
                    <p [jhiTranslate]="card.descriptionKey"></p>
                    <span class="card-cta">
                        <span jhiTranslate="artemisApp.exerciseManagement.addModal.cta.create"></span>
                        <fa-icon [icon]="faArrowRight" class="ms-1" />
                    </span>
                </button>
            }
            <button class="exercise-card" (click)="createGroup()" type="button">
                <div class="card-icon-wrapper">
                    <fa-icon [icon]="faLayerGroup" />
                </div>
                <h6 jhiTranslate="artemisApp.exerciseManagement.addModal.group.title"></h6>
                <p jhiTranslate="artemisApp.exerciseManagement.addModal.group.createDescription"></p>
                <span class="card-cta">
                    <span jhiTranslate="artemisApp.exerciseManagement.addModal.cta.create"></span>
                    <fa-icon [icon]="faArrowRight" class="ms-1" />
                </span>
            </button>
            <button class="exercise-card" data-testid="create-milestone-group" (click)="navigateToCreateMilestoneGroup()" type="button">
                <div class="card-icon-wrapper">
                    <fa-icon [icon]="faFlagCheckered" />
                </div>
                <h6 jhiTranslate="artemisApp.exerciseManagement.addModal.milestoneGroup.title"></h6>
                <p jhiTranslate="artemisApp.exerciseManagement.addModal.milestoneGroup.createDescription"></p>
                <span class="card-cta">
                    <span jhiTranslate="artemisApp.exerciseManagement.addModal.cta.create"></span>
                    <fa-icon [icon]="faArrowRight" class="ms-1" />
                </span>
            </button>
            <span [tumUiTooltip]="hasMilestoneGroup() ? '' : ('artemisApp.exerciseManagement.addModal.userStory.disabledTooltip' | artemisTranslate)" tumUiTooltipPlacement="top">
                <button class="exercise-card" data-testid="create-user-story-exercise" [disabled]="!hasMilestoneGroup()" (click)="navigateToCreateUserStory()" type="button">
                    <div class="card-icon-wrapper">
                        <fa-icon [icon]="faKeyboard" />
                    </div>
                    <h6 jhiTranslate="artemisApp.exerciseManagement.addModal.userStory.title"></h6>
                    <p jhiTranslate="artemisApp.exerciseManagement.addModal.userStory.createDescription"></p>
                    <span class="card-cta">
                        <span jhiTranslate="artemisApp.exerciseManagement.addModal.cta.create"></span>
                        <fa-icon [icon]="faArrowRight" class="ms-1" />
                    </span>
                </button>
            </span>
        </div>
    }

    <!-- ── Import tab ── -->
    @if (activeTab() === 'import') {
        <p class="text-muted-color text-sm mb-3" jhiTranslate="artemisApp.exerciseManagement.addModal.importHint"></p>
        <div class="exercise-grid">
            @for (card of exerciseTypeCards(); track card.type) {
                <button class="exercise-card" [attr.data-testid]="'import-' + card.type + '-exercise'" (click)="startImport(card.type)" type="button">
                    <div class="card-icon-wrapper">
                        <fa-icon [icon]="card.icon" />
                    </div>
                    <h6 [jhiTranslate]="card.labelKey"></h6>
                    <p [jhiTranslate]="card.descriptionKey"></p>
                    <span class="card-cta">
                        <span jhiTranslate="artemisApp.exerciseManagement.addModal.cta.select"></span>
                        <fa-icon [icon]="faArrowRight" class="ms-1" />
                    </span>
                </button>
            }
            <button class="exercise-card" data-testid="import-milestone-group" (click)="requestMilestoneImport()" type="button">
                <div class="card-icon-wrapper">
                    <fa-icon [icon]="faFlagCheckered" />
                </div>
                <h6 jhiTranslate="artemisApp.milestoneImportExport.card.title"></h6>
                <p jhiTranslate="artemisApp.milestoneImportExport.card.importDescription"></p>
                <span class="card-cta">
                    <span jhiTranslate="artemisApp.exerciseManagement.addModal.cta.select"></span>
                    <fa-icon [icon]="faArrowRight" class="ms-1" />
                </span>
            </button>
        </div>
    }

    <!-- ── Export tab: quiz exercises open the quiz export dialog (see requestExport), milestones their own one ── -->
    @if (activeTab() === 'export') {
        <div class="exercise-grid">
            <button class="exercise-card" data-testid="export-quiz-exercises" (click)="requestExport()" type="button">
                <div class="card-icon-wrapper">
                    <fa-icon [icon]="faCheckDouble" />
                </div>
                <h6 jhiTranslate="artemisApp.exerciseManagement.type.QUIZ"></h6>
                <p jhiTranslate="artemisApp.milestoneImportExport.card.quizExportDescription"></p>
                <span class="card-cta">
                    <span jhiTranslate="artemisApp.exerciseManagement.addModal.cta.select"></span>
                    <fa-icon [icon]="faArrowRight" class="ms-1" />
                </span>
            </button>
            <button class="exercise-card" data-testid="export-milestone-group" (click)="requestMilestoneExport()" type="button">
                <div class="card-icon-wrapper">
                    <fa-icon [icon]="faFlagCheckered" />
                </div>
                <h6 jhiTranslate="artemisApp.milestoneImportExport.card.title"></h6>
                <p jhiTranslate="artemisApp.milestoneImportExport.card.exportDescription"></p>
                <span class="card-cta">
                    <span jhiTranslate="artemisApp.exerciseManagement.addModal.cta.select"></span>
                    <fa-icon [icon]="faArrowRight" class="ms-1" />
                </span>
            </button>
        </div>
    }
</tum-ui-dialog>
