<tumaet-ui-dialog [(visible)]="visible" [header]="headerStringKey() | artemisTranslate" [closable]="true" [closeOnEscape]="true" [dismissableMask]="false" size="medium">
    <div class="d-flex flex-column gap-4">
        <!-- Name + Points -->
        <div class="d-flex flex-wrap gap-3">
            <div class="flex-grow-1">
                <label class="fw-semibold d-block mb-1" for="group-edit-title" jhiTranslate="artemisApp.exerciseManagement.groupEdit.name"></label>
                <input
                    id="group-edit-title"
                    tumAetUiInput
                    class="w-100"
                    [attr.maxlength]="MAX_TITLE_LENGTH"
                    [ngModel]="draftTitle()"
                    (ngModelChange)="draftTitle.set($event)"
                    [placeholder]="'artemisApp.exerciseManagement.groupEdit.namePlaceholder' | artemisTranslate"
                    [tumAetUiInputInvalid]="!isTitleValid()"
                />
            </div>
            @if (group().type === 'milestone') {
                <div>
                    <label class="d-flex align-items-center gap-1 fw-semibold mb-1">
                        <span jhiTranslate="artemisApp.exerciseManagement.groupEdit.sumOfPoints"></span>
                        <fa-icon
                            [icon]="faCircleInfo"
                            [tumAetUiTooltip]="'artemisApp.exerciseManagement.groupEdit.sumOfPointsTooltip' | artemisTranslate"
                            tumAetUiTooltipPlacement="top"
                            class="text-muted"
                        />
                    </label>
                    <div class="form-control-plaintext">{{ draftMaxPoints() ?? 0 }}</div>
                </div>
            } @else {
                <div>
                    <label class="d-flex align-items-center gap-1 fw-semibold mb-1" for="group-edit-max-points">
                        <span jhiTranslate="artemisApp.exerciseManagement.groupEdit.maxPoints"></span>
                        <fa-icon
                            [icon]="faCircleInfo"
                            [tumAetUiTooltip]="'artemisApp.exerciseManagement.groupEdit.maxPointsTooltip' | artemisTranslate"
                            tumAetUiTooltipPlacement="top"
                            class="text-muted"
                        />
                    </label>
                    <tumaet-ui-input-number
                        inputId="group-edit-max-points"
                        [ngModel]="draftMaxPoints()"
                        (ngModelChange)="draftMaxPoints.set($event)"
                        [min]="0"
                        [maxFractionDigits]="1"
                        [showButtons]="true"
                        [placeholder]="'artemisApp.exerciseManagement.groupEdit.maxPointsPlaceholder' | artemisTranslate"
                    />
                </div>
            }
        </div>

        <!-- Description: a milestone group is described by its milestone's problem statement instead. -->
        @if (group().type !== 'milestone') {
            <div class="d-flex flex-column gap-2">
                <div>
                    <div class="fw-semibold" jhiTranslate="artemisApp.exerciseManagement.groupEdit.description"></div>
                    <div class="text-body-secondary small" jhiTranslate="artemisApp.exerciseManagement.groupEdit.descriptionHint"></div>
                </div>
                <div>
                    <label class="d-block mb-1" for="group-edit-description-heading" jhiTranslate="artemisApp.exerciseManagement.groupEdit.descriptionHeading"></label>
                    <input
                        id="group-edit-description-heading"
                        data-testid="group-edit-description-heading"
                        tumAetUiInput
                        class="w-100"
                        [attr.maxlength]="MAX_DESCRIPTION_HEADING_LENGTH"
                        [ngModel]="draftDescriptionHeading()"
                        (ngModelChange)="draftDescriptionHeading.set($event)"
                        [placeholder]="'artemisApp.exerciseVariantGroup.detail.callout.heading' | artemisTranslate"
                    />
                </div>
                <div>
                    <label class="d-block mb-1" for="group-edit-description-body" jhiTranslate="artemisApp.exerciseManagement.groupEdit.descriptionBody"></label>
                    <textarea
                        id="group-edit-description-body"
                        data-testid="group-edit-description-body"
                        tumAetUiTextarea
                        class="w-100"
                        rows="3"
                        [attr.maxlength]="MAX_DESCRIPTION_BODY_LENGTH"
                        [ngModel]="draftDescriptionBody()"
                        (ngModelChange)="draftDescriptionBody.set($event)"
                        [placeholder]="'artemisApp.exerciseVariantGroup.detail.callout.body' | artemisTranslate: { count: group().exercises?.length ?? 0 }"
                    ></textarea>
                </div>
            </div>
        }

        <!-- Dates -->
        <div>
            <div class="fw-semibold mb-2" jhiTranslate="artemisApp.exerciseManagement.groupEdit.dates"></div>
            <tumaet-ui-message severity="warn" [icon]="faTriangleExclamation" class="mb-2">
                <span jhiTranslate="artemisApp.exerciseManagement.groupEdit.datesOverrideWarning"></span>
            </tumaet-ui-message>
            <jhi-timeline [timelineItems]="timelineItems()" (timelineStatusChange)="timelineStatus.set($event)" />
            @if (!timelineStatus().valid) {
                <tumaet-ui-message severity="error" [icon]="faCircleXmark" class="mt-2">
                    <span jhiTranslate="artemisApp.exerciseManagement.groupEdit.datesInvalidOrder"></span>
                </tumaet-ui-message>
            }
        </div>
    </div>

    <ng-template #footer>
        <tumaet-ui-button severity="secondary" variant="text" (clicked)="onCancel()">
            <span jhiTranslate="entity.action.cancel"></span>
        </tumaet-ui-button>
        <tumaet-ui-button [disabled]="isSaveDisabled()" (clicked)="onSave()">
            <span jhiTranslate="entity.action.save"></span>
        </tumaet-ui-button>
    </ng-template>
</tumaet-ui-dialog>
