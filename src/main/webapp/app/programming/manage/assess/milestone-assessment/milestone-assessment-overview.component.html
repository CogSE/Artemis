<div class="milestone-overview">
    <section>
        <h4 jhiTranslate="artemisApp.milestoneAssessment.overview.problemStatement"></h4>
        @if (milestoneExercise()?.problemStatement) {
            <jhi-programming-exercise-instructions [exercise]="milestoneExercise()" [participation]="milestoneParticipation()" [personalParticipation]="false" />
        } @else {
            <p class="milestone-overview__empty" jhiTranslate="artemisApp.milestoneAssessment.overview.noProblemStatement"></p>
        }
    </section>

    <section>
        <h4 jhiTranslate="artemisApp.milestoneAssessment.overview.codeQuality"></h4>
        @if (assessment().staticCodeAnalysisEnabled) {
            <jhi-milestone-code-quality [exercise]="milestoneExercise()" [result]="assessment().milestoneResult" [inline]="true" />
        } @else {
            <p class="milestone-overview__empty" jhiTranslate="artemisApp.milestoneAssessment.overview.codeQualityDisabled"></p>
        }
    </section>
</div>
