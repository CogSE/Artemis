@if (isApplicable()) {
    @if (inline()) {
        <div class="code-quality__inline">
            <ng-container *ngTemplateOutlet="issues" />
        </div>
    } @else {
        <button type="button" class="code-quality__trigger" (click)="openDetails()">
            <jhi-information-box [informationBoxData]="infoBoxData()" layout="inline">
                <span contentComponent class="code-quality__summary">
                    @if (status() === 'building') {
                        <fa-icon [icon]="faCircleNotch" size="lg" animation="spin" class="text-primary" />
                        <span class="code-quality__pending" [jhiTranslate]="pendingLabel()"></span>
                    } @else {
                        @switch (status()) {
                            @case ('clean') {
                                <fa-icon [icon]="faCircleCheck" class="text-state-success" />
                            }
                            @case ('informational') {
                                <fa-icon [icon]="faTriangleExclamation" class="text-state-warning" />
                            }
                            @case ('deducting') {
                                <fa-icon [icon]="faCircleXmark" class="text-state-danger" />
                            }
                            @default {}
                        }
                        <span>{{ issueCount() }}</span>
                        @if (totalPenalty() > 0) {
                            <span class="text-state-danger">{{
                                'artemisApp.exerciseVariantGroup.detail.codeQuality.boxDeduction' | artemisTranslate: { penalty: totalPenalty() | number: '1.0-2' }
                            }}</span>
                        }
                    }
                </span>
            </jhi-information-box>
        </button>

        <tumaet-ui-dialog
            [(visible)]="detailsVisible"
            [dismissableMask]="true"
            size="large"
            [header]="'artemisApp.exerciseVariantGroup.detail.codeQuality.title' | artemisTranslate"
        >
            <ng-container *ngTemplateOutlet="issues" />
        </tumaet-ui-dialog>
    }
}

<ng-template #issues>
    @if (isPending()) {
        <p class="code-quality__hint" [jhiTranslate]="pendingLabel()"></p>
    }
    @if (issueCount()) {
        <p class="code-quality__hint" jhiTranslate="artemisApp.exerciseVariantGroup.detail.codeQuality.sharedCodebaseHint"></p>
        @if (isCapped()) {
            <p class="code-quality__hint" jhiTranslate="artemisApp.exerciseVariantGroup.detail.codeQuality.capped" [translateValues]="{ cap: penaltyCap() | number: '1.0-2' }"></p>
        }

        <div class="mt-2">
            <!-- The node reads its input once, so tracking the group itself re-creates it for each new result. -->
            @for (group of groups(); track group) {
                <jhi-feedback-node [feedbackItemNode]="group" [course]="course()" />
            }
        </div>
    } @else if (!isPending()) {
        <p class="code-quality__hint" jhiTranslate="artemisApp.exerciseVariantGroup.detail.codeQuality.noIssues"></p>
    }
</ng-template>
